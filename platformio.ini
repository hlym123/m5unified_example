; M5Unified hardware validation examples

[platformio]
default_envs = m5stack-corep4x-display-touch

[env]
lib_extra_dirs = ../M5GFX, ../M5Unified

[env:corep4x]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = corep4x
framework = arduino
platform_packages =
    framework-espidf @ https://github.com/pioarduino/esp-idf/releases/download/v5.5.4/esp-idf-v5.5.4.tar.xz
custom_sdkconfig =
    # CONFIG_ESP32P4_SELECTS_REV_LESS_V3 is not set
    # CONFIG_ESP32P4_REV_MIN_1 is not set
    # CONFIG_ESP32P4_REV_MIN_300 is not set
    CONFIG_ESP32P4_REV_MIN_301=y
    CONFIG_ESP32P4_REV_MIN_FULL=301
    CONFIG_ESP_REV_MIN_FULL=301
    CONFIG_ESP32P4_REV_MAX_FULL=399
    CONFIG_ESP_REV_MAX_FULL=399
    CONFIG_FREERTOS_HZ=1000
    CONFIG_FMB_MASTER_MAX_API_BLOCKING_TIME_MS=10000
monitor_speed = 115200
upload_speed = 1500000
upload_flags =
    --before
    no-reset
    --after
    no-reset
    --no-stub
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_corep4x.csv
build_flags =
    -DESP32P4
    -DBOARD_ID=31
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3

[env:m5stack-corep4x-display-touch]
extends = env:corep4x
build_src_filter = -<*> +<corep4x_display_touch.cpp>

[env:m5stack-corep4x-audio]
extends = env:corep4x
build_src_filter = -<*> +<corep4x_audio.cpp>

[env:m5stack-corep4x-rtc]
extends = env:corep4x
build_src_filter = -<*> +<corep4x_rtc.cpp>

[env:m5stack-corep4x-speaker-tone]
extends = env:corep4x
build_src_filter = -<*> +<corep4x_speaker_tone.cpp>

[env:m5stack-corep4x-power]
extends = env:corep4x
build_src_filter = -<*> +<corep4x_power.cpp>

[env:m5stack-corep4x-imu]
extends = env:corep4x
build_src_filter = -<*> +<corep4x_imu.cpp>

[env:m5stack-corep4x-tf-card]
extends = env:corep4x
build_src_filter = -<*> +<corep4x_tf_card.cpp>

[env:m5stack-corep4x-grove-i2c]
extends = env:corep4x
build_src_filter = -<*> +<corep4x_grove_i2c.cpp>

[env:m5stack-corep4x]
extends = env:corep4x
build_src_filter = -<*> +<corep4x_test.cpp>

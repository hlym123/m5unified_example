; StampP4X board-detection validation

[platformio]
default_envs = m5stack-stampp4x

[env]
lib_deps =
    https://github.com/hlym123/M5GFX.git#5357d81fa05f60dbb7f9df8a16ccf8707eaa7091
    https://github.com/hlym123/M5Unified.git#343ce6f0a5a6775d666f13b4351ebc127c43ddbc

[env:m5stack-stampp4x]
platform = espressif32
board = esp32-p4_r3
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
build_src_filter = -<*> +<stamp_p4x_test.cpp>
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_ID=156
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
